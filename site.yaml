---
- name: Multi-Tier Web & DB Automation Deployment
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    - name: Gather and evaluate server facts (RAM & CPU based tuning)
      ansible.builtin.include_tasks: tasks/facts.yaml

    - name: Install and enable required packages
      ansible.builtin.include_tasks: tasks/packages.yaml

    - name: Deploy configuration files and content
      ansible.builtin.include_tasks: tasks/config.yaml

    - name: Configure the firewall
      ansible.builtin.include_tasks: tasks/firewall.yaml

  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted

    - name: Restart mariadb
      ansible.builtin.service:
        name: mariadb
        state: restarted
